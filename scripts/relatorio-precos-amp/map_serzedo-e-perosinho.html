<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html,body{margin:0;padding:0;background:#fff}
  #map{width:1000px;height:560px}
  .lbl{background:#0d0d0d;color:#C9A84C;border:1.5px solid #C9A84C;border-radius:6px;
        padding:2px 6px;font:700 14px/1 Arial;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  
</style></head><body>
<div id="map"></div>

<script>
var VMIN=1204.5, VMAX=4155.0;
function color(v){
  var t=(v-VMIN)/((VMAX-VMIN)||1);
  var r,g,b;
  if(t<0.5){var k=t/0.5; r=Math.round(46+(249-46)*k); g=Math.round(125+(168-125)*k); b=Math.round(50+(37-50)*k);}
  else{var k=(t-0.5)/0.5; r=Math.round(249+(198-249)*k); g=Math.round(168+(40-168)*k); b=Math.round(37+(40-37)*k);}
  return 'rgb('+r+','+g+','+b+')';
}
var map=L.map('map',{zoomControl:false,attributionControl:false});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(map);
var pts=[{"lat": 41.06203199999999, "lng": -8.583442400000001, "m2": 1968.0, "ask": 199000.0}];
var SHOW_LABELS=true;
var group=[];
pts.forEach(function(p){
  var m=L.circleMarker([p.lat,p.lng],{radius:15,color:'#0d0d0d',weight:2,fillColor:color(p.m2),fillOpacity:0.92}).addTo(map);
  if(SHOW_LABELS && p.ask){ m.bindTooltip(Math.round(p.ask/1000)+'k €',{permanent:true,direction:'top',className:'lbl',offset:[0,-6]}); }
  group.push([p.lat,p.lng]);
});
if(group.length===1){ map.setView(group[0],15); }
else { map.fitBounds(group,{padding:[60,60]});  }
setTimeout(function(){window.__ready=true;},300);
</script></body></html>
