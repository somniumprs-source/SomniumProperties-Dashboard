name: Deploy Edge Functions

# Publica automaticamente o backend (Supabase Edge Functions) sempre que ha
# alteracoes em supabase/ no branch main. O frontend ja publica sozinho via Vercel.
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: mjgusjuougzoeiyavsor
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy todas as Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
