name: Deploy Edge Functions

# Publica automaticamente o backend (Supabase Edge Functions) sempre que ha
# alteracoes em supabase/ no branch main. O frontend ja publica sozinho via Vercel.
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: mjgusjuougzoeiyavsor
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Fixado: a v2.102.0 (29-05-2026) passou a rejeitar bundles grandes
          # com 413 "request entity too large" (ex: cron-reclassificacao 22MB),
          # partindo o deploy. A v2.101.0 (a ultima que correu com sucesso) nao
          # tem esse problema. Rever quando o Supabase corrigir em versoes futuras.
          version: 2.101.0
      - name: Deploy Edge Functions (uma a uma, resiliente)
        # Deploy funcao-a-funcao em vez de em bloco: uma funcao que falhe (ex:
        # crons grandes que batem no limite 413 do Supabase) nao bloqueia o
        # deploy das restantes (crm, dashboard, ...). Falha o job no fim apenas
        # se uma funcao CRITICA nao publicou; crons grandes apenas avisam.
        run: |
          CRITICAS="crm dashboard users sops calendar voice"
          falhas_criticas=""
          avisos=""
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir")
            [ "$fn" = "_shared" ] && continue
            echo "::group::deploy $fn"
            if supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"; then
              echo "OK: $fn"
            else
              echo "FALHOU: $fn"
              if echo " $CRITICAS " | grep -q " $fn "; then
                falhas_criticas="$falhas_criticas $fn"
              else
                avisos="$avisos $fn"
              fi
            fi
            echo "::endgroup::"
          done
          [ -n "$avisos" ] && echo "::warning::Funcoes nao-criticas que falharam (provavelmente >limite de tamanho):$avisos"
          if [ -n "$falhas_criticas" ]; then
            echo "::error::Funcoes criticas falharam:$falhas_criticas"
            exit 1
          fi
          echo "Deploy concluido (criticas OK)."
